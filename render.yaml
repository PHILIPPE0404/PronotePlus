services:
  - type: web
    name: pronote-plus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PRONOTE_MAX_UPLOAD_MB
        value: "25"
